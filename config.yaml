# SpecBridge — example configuration
#
# Run:
#   specbridge GET /customers
#   specbridge GET /customers --dry-run
#   specbridge GET /customers --debug
#
# All fields under `api` are required.
# All fields under `llm` and `output` are optional (shown with defaults).

api:
  # Path to the API spec file (OpenAPI YAML/JSON or RAML).
  # Relative paths resolve from the directory you run `specbridge` in.
  spec: procore_api_info/combined_OAS.json

  # Spec format: openapi | openapi3 | swagger | oas | raml
  format: openapi

  # Optional: dotted Python path to an ApiAdapter subclass.
  # If absent or null, the base adapter (all pass-throughs) is used.
  adapter: specbridge.adapters.procore.ProcoreAdapter

llm:
  # LLM provider: anthropic | openai
  provider: openai

  # Model override. If absent, the provider's default model is used.
  # Anthropic default: claude-3-5-haiku-20241022
  model: gpt-5.3-codex

  # API key. If absent, falls back to the provider's environment variable:
  #   Anthropic → ANTHROPIC_API_KEY
  #   OpenAI    → OPENAI_API_KEY
  # api_key: sk-ant-...

  # Hard cap on tokens the LLM may produce per call.
  # Anthropic default: 8192 (required by the API; set to your model's maximum).
  # OpenAI default: uncapped (model runs until natural completion).
  # Only set this if you need to limit cost or latency on a per-call basis.
  # max_output_tokens: 8192

  # Token budget per LLM call. Prompts are split into pages that fit within
  # this limit. Raise to send more fields per call; lower for tighter prompts.
  # Procore types average 10–25 fields; 4500 keeps most types on one page
  # while leaving room for field descriptions and the example code block.
  target_input_tokens: 32768

  # Minimum fields per page regardless of token budget. Prevents degenerate
  # single-field pages when field descriptions are unusually verbose.
  min_page_size: 4

output:
  # Directory where output folders are written.
  # Each run creates: output/<METHOD>_<path-slug>/ir.json, schema.md, *.cs
  dir: output

codegen:
  # Maximum number of object fields sent to the LLM per call.
  # When absent (null), page size is calibrated automatically using token counting
  # so that each prompt stays within llm.target_input_tokens. Set a fixed integer
  # to override calibration and use a hard page size instead.
  # fields_per_page: 8

  # Maximum number of enum values sent to the LLM per call.
  # Large enums (100+ values) are split and stitched the same way as object types.
  enum_values_per_page: 30

  # Maximum retry attempts per type when per-type validation finds errors.
  # On each retry, validation errors are injected into the prompt as a
  # CORRECTION REQUIRED block so the LLM can fix what went wrong.
  # Set to 0 to disable retries entirely.
  max_retries: 2

pii:
  # Run LLM-based PII classification before code generation.
  # When enabled, every field in every type is classified. Results are stored
  # in ir.json (root_type/nested_types[*].properties[*].pii/pii_reason/pii_review).
  # PII fields get [WriteOnly] in generated C#. Borderline fields get // [REVIEW: ...].
  # Skipped automatically during --dry-run.
  # Set to false to disable.
  enabled: true

  # Fields sent per LLM classification call. Lower = more reliable JSON parsing.
  # batch_size: 20

validation:
  # Run deterministic checks on generated code after each LLM generation.
  # Results are printed to stderr and recorded in ir.json under "validation".
  # Checks: brace balance, stitch artifacts, missing/phantom/duplicate fields,
  #         undeclared property types, hallucinated fields.
  # Skipped automatically during --dry-run.
  enabled: true
